[network]
# データ受信ポート
data_port = 8000
# コマンド送信ポート
cmd_port = 8001
# パケットサイズ (bytes)
packet_size = 37
# ブロードキャストアドレス
broadcast_addr = 192.168.179.255

[graph]
# グラフに表示する時間幅 (秒)
display_time_window = 10.0
# 画面に描画する最大ポイント数 (自動間引き用)
max_display_points = 500
# データバッファの最大ポイント数 (受信データ保持量)
max_buffer_points = 100000
# Y軸の範囲 [N]
y_axis_min = -3.0
y_axis_max = 3.0
# アニメーション更新間隔 (ms)
animation_interval = 100

[devices]
# MACアドレスとIDの対応 (deviceN = MAC, ID)
device1 = 84:1F:E8:85:29:CC, 1
device2 = 84:1F:E8:85:53:68, 2
device3 = 84:1F:E8:85:18:38, 3
device4 = 84:1F:E8:85:2E:10, 4
device5 = 44:1D:64:62:B8:50, 5
device6 = 44:1D:64:62:B7:B4, 6
device7 = 44:1D:64:62:AB:48, 7




